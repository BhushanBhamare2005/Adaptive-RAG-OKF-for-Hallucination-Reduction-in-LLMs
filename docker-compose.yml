services:
  backend:
    build:
      context: ./backend
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./outputs:/app/outputs
      - ./data:/app/data

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:80"
    depends_on:
      - backend
